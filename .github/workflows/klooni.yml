name: Klooni landscape
on:
  push:
    branches: ['codex/webview74-test']
    paths: ['ports/klooni/**', '.github/workflows/klooni.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Fetch pinned upstream and adapt layout
        run: |
          mkdir -p work
          git clone https://codeberg.org/Lonami/Klooni1010.git work/klooni-landscape
          git -C work/klooni-landscape checkout 0feafd104aef289c6560b8932d20df5e4853a301
          node ports/klooni/patch.cjs
      - name: Build Android app
        working-directory: work/klooni-landscape
        run: gradle --no-daemon :android:assembleDebug
      - name: Package matching source
        run: |
          mkdir -p dist/klooni
          cp work/klooni-landscape/android/build/outputs/apk/debug/android-debug.apk dist/klooni/klooni-landscape.apk
          cd work/klooni-landscape
          zip -qr ../../dist/klooni/klooni-landscape-source.zip . -x '.git/*' '.gradle/*' '*/build/*' 'android/libs/*'
      - uses: actions/upload-artifact@v4
        with:
          name: klooni-landscape
          path: dist/klooni/*
