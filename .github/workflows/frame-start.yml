name: Sandstrøm startmeny
on:
  push:
    branches: ['codex/webview74-test']
    paths: ['android-start/**', '.github/workflows/frame-start.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify start menu
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          bt="$sdk/build-tools/34.0.0"
          api="$sdk/platforms/android-34/android.jar"
          if [[ ! -x "$bt/d8" || ! -f "$api" ]]; then
            "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
          fi
          mkdir -p out/classes out/dex
          javac -source 8 -target 8 -classpath "$api" -d out/classes android-start/StartActivity.java
          "$bt/d8" --min-api 23 --lib "$api" --output out/dex out/classes/no/skylit/framestart/StartActivity.class
          "$bt/aapt2" link -I "$api" --manifest android-start/AndroidManifest.xml -o out/unsigned.apk
          (cd out/dex && zip -q -j ../unsigned.apk classes.dex)
          "$bt/zipalign" -f 4 out/unsigned.apk out/aligned.apk
          keytool -genkeypair -keystore out/start.jks -storepass android -keypass android -alias start -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=Skylit Start Menu'
          "$bt/apksigner" sign --ks out/start.jks --ks-pass pass:android --out out/skylit-startmeny.apk out/aligned.apk
          "$bt/apksigner" verify out/skylit-startmeny.apk
      - uses: actions/upload-artifact@v4
        with:
          name: skylit-startmeny
          path: out/skylit-startmeny.apk
          if-no-files-found: error
